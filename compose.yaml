services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: group_sport
      POSTGRES_USER: group_sport
      POSTGRES_PASSWORD: group_sport
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U group_sport"]
      interval: 2s
      timeout: 2s
      retries: 15
